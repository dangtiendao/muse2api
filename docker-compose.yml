version: '3.8'

services:
  muse2api:
    build: .
    image: muse2api:latest
    container_name: muse2api
    restart: always
    ports:
      - "18610:18610"
    environment:
      # Khóa xác thực API & Quản trị (đọc từ .env hoặc môi trường host, để trống sẽ tự động tạo)
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      # URL cơ sở công khai của dịch vụ, ví dụ https://your-domain.com (để trống frontend quản trị sẽ tự nhận diện domain hiện tại)
      - MUSE2API_PUBLIC_BASE=
      # Cấu hình thời gian chờ timeout (giây)
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
    volumes:
      # Lưu trữ bền vững cấu hình tài khoản, nhật ký nhiệm vụ và tệp media
      - ./data:/app/data
    shm_size: '2gb' # Đảm bảo Chromium render nhiều tab không bị crash do cạn kiệt /dev/shm
