site_name: MUSE2API Documentation
site_description: Hệ thống tài liệu kỹ thuật toàn diện cho dự án MUSE2API
site_author: MUSE2API Contributors
site_url: https://czg86389-hub.github.io/muse2api/

repo_name: czg86389-hub/muse2api
repo_url: https://github.com/czg86389-hub/muse2api

docs_dir: docs

theme:
  name: material
  language: vi
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Chuyển sang giao diện tối
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Chuyển sang giao diện sáng
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list

