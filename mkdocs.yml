  - Trang chủ: README.md
  - 01. Tổng quan:
      - Giới thiệu: 01-tong-quan/gioi-thieu.md
      - Kiến trúc: 01-tong-quan/kien-truc.md
      - Cấu trúc thư mục: 01-tong-quan/cau-truc-thu-muc.md
      - Công nghệ: 01-tong-quan/cong-nghe.md
  - 02. Cài đặt:
      - Yêu cầu hệ thống: 02-cai-dat/yeu-cau-he-thong.md
      - Hướng dẫn cài đặt: 02-cai-dat/huong-dan-cai-dat.md
      - Cấu hình (.env): 02-cai-dat/cau-hinh.md
      - Chạy & Vận hành: 02-cai-dat/chay-du-an.md
  - 03. Phân tích Module:
