# ==========================================
# Cấu hình mẫu Nginx Reverse Proxy cho MUSE2API
# ==========================================
# Phù hợp với aaPanel / 1Panel / Nginx độc lập
# Trọng tâm cốt lõi: Tăng proxy_read_timeout, tắt proxy_buffering để đảm bảo đầu ra stream SSE
# ==========================================

server {
    listen 80;
    server_name your-domain.com; # Thay thế bằng domain hoặc IP của bạn

    # Cho phép tải lên ảnh tham chiếu (Image-to-Image / Image Edit hỗ trợ ảnh lớn đa phương thức)
    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:18610;

        # Cốt lõi: Tạo ảnh và tạo video cần 30~120 giây, mặc định 60s sẽ khiến Nginx báo 502 Bad Gateway
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # Cốt lõi: Tắt bộ đệm để đảm bảo SSE Stream mô phỏng máy đánh chữ của /v1/chat/completions không bị trễ
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Header proxy tiêu chuẩn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tương thích WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
